[build-system]
# 77+ for PEP 639 SPDX license expressions (license = "MIT").
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-fetcher"
description = "Search scholarly literature, deduplicate across sources, and export a citable corpus."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Aliyu" }]
keywords = ["bibliometrics", "systematic-review", "google-scholar", "openalex", "bibtex", "ris"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dynamic = ["version"]

# 3.10 is a floor, not a preference: the codebase uses PEP 604 unions (str | None)
# in annotations that are evaluated at definition time.
requires-python = ">=3.10"

dependencies = [
    "google-search-results>=2.4.2,<3",
]

[project.optional-dependencies]
# Excel export only; CSV/BibTeX/RIS and the whole test suite run on the stdlib.
excel = ["pandas>=2.0,<4", "openpyxl>=3.1,<4"]
gui = ["streamlit>=1.49,<2", "pandas>=2.0,<4", "openpyxl>=3.1,<4"]
dev = ["pytest>=7,<10"]

[project.scripts]
scholar-fetch = "scholar_fetcher.cli:main"

[tool.setuptools]
packages = ["scholar_fetcher"]

[tool.setuptools.dynamic]
version = { attr = "scholar_fetcher.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
